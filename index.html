<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1226">
  <title>微光小鎮 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1226; }
    canvas { display: block; touch-action: none; image-rendering: pixelated; }
    body { color: #eef1f7; font: 14px/1.45 system-ui, "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif; }
    button { border: 1px solid #ffffff33; background: #1c2440d9; color: #eef1f7; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
    button.on { background: #e8b74a; color: #1c1a14; border-color: #e8b74a; font-weight: 700; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #top { position: fixed; left: 12px; top: 10px; right: 12px; pointer-events: none; text-shadow: 0 1px 3px #000c; }
    #top h1 { margin: 0; font-size: 15px; }
    #top .meta { margin: 2px 0 6px; font-size: 12px; color: #d6dbe6; }
    #top button { pointer-events: auto; }
    #timeline { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(#0d122600, #0d1226e6 30%); }
    #timeline input { width: 100%; margin: 6px 0; accent-color: #e8b74a; }
    #play { width: 40px; font-size: 16px; padding: 4px 0; }
    #ylabel { font-weight: 700; font-size: 15px; min-width: 9em; }
    .hint { color: #aab3c6; font-size: 12px; margin-left: auto; }
    .chips button { font-size: 12px; padding: 4px 8px; }
    /* 標題與關閉鈕固定，只有清單捲動（捲到最近發生的事時不會把標題捲走） */
    #bio { position: fixed; right: 12px; top: 64px; width: min(340px, calc(100vw - 24px)); max-height: calc(100vh - 200px);
      display: flex; flex-direction: column; overflow: hidden;
      background: #141a30f2; border: 1px solid #ffffff26; border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 30px #0008; }
    #bio[hidden] { display: none; }
    #bio ol { overflow: auto; min-height: 0; flex: 1; }
    #bio h2 { margin: 0 24px 2px 0; font-size: 16px; }
    #bio .sub { margin: 0 0 8px; color: #aab3c6; font-size: 12px; }
    #bio ol { margin: 0; padding-left: 0; list-style: none; }
    #bio li { padding: 5px 0; border-top: 1px solid #ffffff14; }
    #bio li b { display: inline-block; min-width: 5.5em; color: #e8b74a; font-weight: 600; }
    #bio li.future { opacity: .38; }
    /* D026：建築卡的處置按鈕（滅火、處理犯罪、治療）；觸控目標 ≥ 44px，沒有處置時整列不佔位 */
    #bio .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    #bio .acts:empty { display: none; }
    #bio .acts button { flex: 1 1 auto; min-height: 44px; padding: 6px 12px; }
    #bio .x { position: absolute; right: 8px; top: 8px; padding: 2px 8px; }
    /* D003：貼上分享碼的對話框 */
    #dlg { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; padding: 16px; }
    #dlg[hidden] { display: none; }
    #dlg .card { width: min(560px, 100%); background: #141a30f5; border: 1px solid #ffffff26; border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px #0008; }
    #dlg h2 { margin: 0 0 4px; font-size: 16px; }
    #dlg .sub { margin: 0 0 8px; color: #aab3c6; font-size: 12px; }
    #dlg textarea { width: 100%; box-sizing: border-box; height: 30vh; resize: vertical; background: #0d1226; color: #eef1f7; border: 1px solid #ffffff33; border-radius: 8px; padding: 8px; font: 12px/1.4 ui-monospace, monospace; word-break: break-all; }
    #dlg .err { color: #ff8a8a; min-height: 1.2em; margin: 6px 0; font-size: 13px; }
    /* D027：☰「幸福構成」面板（實驗線 showStats「幸福構成」的 3D 版）：一項一列，正的綠、負的紅，最負的一項標紅、下面附建議；D028：☰「收支明細」面板（#fin）用同一套樣式 */
    #hs, #fin, #nc, #rk, #pl, #tc, #cm, #ch { position: fixed; inset: 0; z-index: 20; background: #0008; display: flex; align-items: center; justify-content: center; padding: 16px; }
    #hs[hidden], #fin[hidden], #nc[hidden], #rk[hidden], #pl[hidden], #tc[hidden], #cm[hidden], #ch[hidden] { display: none; }
    #hs .card, #fin .card, #nc .card, #rk .card, #pl .card, #tc .card, #cm .card, #ch .card { width: min(460px, 100%); max-height: 86vh; overflow: auto; background: #141a30f5; border: 1px solid #ffffff26; border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px #0008; }
    #hs h2, #fin h2, #nc h2, #rk h2, #pl h2, #tc h2, #cm h2, #ch h2 { margin: 0 0 4px; font-size: 16px; }
    #hs .sub, #fin .sub, #nc .sub, #rk .sub, #pl .sub, #tc .sub, #cm .sub, #ch .sub { margin: 0 0 8px; color: #aab3c6; font-size: 12px; }
    #hs ol, #fin ol, #nc ol, #rk ol, #pl ol, #tc ol, #cm ol, #ch ol { margin: 0; padding: 0; list-style: none; }
    #hs li, #fin li, #nc li, #rk li, #pl li, #tc li, #cm li, #ch li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid #ffffff14; }
    #hs li span.pos, #fin li span.pos, #nc li span.pos, #rk li, #pl li span.pos, #tc li span.pos, #cm li span.pos, #ch li span.pos { color: #7bd88f; } #hs li span.neg, #fin li span.neg, #nc li span.neg, #rk li, #pl li span.neg, #tc li span.neg, #cm li span.neg, #ch li span.neg { color: #ff8a8a; }
    #hs li.bad b, #fin li.bad b, #nc li.bad b, #rk li.bad b, #pl li.bad b, #tc li.bad b, #cm li.bad b, #ch li.bad b { color: #e05252; } #hs li.sum, #fin li.sum, #nc li.sum, #rk li.sum, #pl li.sum, #tc li.sum, #cm li.sum, #ch li.sum { border-top: 1px solid #ffffff40; font-weight: 700; }
    #hs .tip, #fin .tip, #nc .tip, #rk .tip, #pl .tip, #tc .tip, #cm .tip, #ch .tip { color: #e05252; font-size: 12px; margin: 8px 0 0; } #hs .tip:empty, #fin .tip:empty, #nc .tip:empty, #rk .tip:empty, #pl .tip:empty, #tc .tip:empty, #cm .tip:empty, #ch .tip:empty { display: none; }
    #rk .bar { height: 8px; background: #1c2340; border-radius: 4px; overflow: hidden; margin: 2px 0 8px; } #rk .bar i { display: block; height: 100%; background: linear-gradient(90deg, #5ec8ff, #7be08a); }
    #hs .row, #fin .row, #nc .row, #rk .row, #pl .row, #tc .row, #cm .row, #ch .row { margin-top: 10px; } #hs .row button, #fin .row button, #nc .row button, #rk .row, #pl .row button, #tc .row button, #cm .row button, #ch .row button { min-height: 44px; min-width: 72px; }
    /* D032：☰「政策與預算」面板（#pl）：每一列＝名稱＋控制（稅率與預算是 − 倍率 ＋，開關是一顆按鈕）＋一行效果與日費與冷卻；按鈕 44px 以上（手機） */
    #pl .card, #tc .card, #cm .card { width: min(520px, 100%); }
    #pl .head, #tc .head, #cm .head { position: sticky; top: -14px; z-index: 2; margin: -14px -16px 6px; padding: 14px 16px 6px; background: #141a30; border-bottom: 1px solid #ffffff1f; }   /* 標題、日費合計與提示固定在上面（面板很長，捲到下面的政策也看得到冷卻的提示） */
    #pl .foot, #tc .foot, #cm .foot { position: sticky; bottom: -14px; z-index: 2; margin: 8px -16px -14px; padding: 8px 16px 14px; background: #141a30; border-top: 1px solid #ffffff1f; }
    #pl .head .sub, #tc .head .sub, #cm .head .sub { margin-bottom: 2px; } #pl .head .tip, #tc .head .tip, #cm .head .tip { margin: 4px 0 0; }
    #pl h3, #tc h3, #cm h3 { margin: 12px 0 2px; font-size: 13px; color: #aab3c6; font-weight: 600; }
    #pl li, #tc li, #cm li { display: block; padding: 6px 0; }
    #pl li .h, #tc li .h, #cm li .h { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
    #pl li .ctl, #tc li .ctl, #cm li .ctl { display: flex; align-items: center; gap: 6px; }
    #pl li .ctl button, #tc li .ctl button, #cm li .ctl button { min-width: 44px; min-height: 44px; font-size: 18px; }
    #pl li .val, #tc li .val, #cm li .val { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
    #pl li small.note, #tc li small.note, #cm li small.note { display: block; color: #aab3c6; font-size: 11.5px; margin-top: 2px; } #pl li small.cool, #tc li small.cool, #cm li small.cool { color: #e0a752; }
    #pl li button.on, #tc li button.on, #cm li button.on { background: #2f7d4a; border-color: #7bd88f; color: #fff; }
    /* D038：☰「科技與專精」面板（#tc）借 #pl 的版面；路線分頁（四顆，手機一列四個）、節點的狀態（已完成淡綠、進行中金色、開不了暗掉）、研究進度條 */
    #tc .tabs, #cm .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 12px 0 4px; }
    #tc .tabs button, #cm .tabs button { min-height: 44px; padding: 4px 2px; font-size: 12px; line-height: 1.25; }
    #tc .tabs button.on, #cm .tabs button.on { background: #2b4a8a; border-color: #8fb4ff; color: #fff; }
    #tc li .h b, #cm li .h b { font-size: 13.5px; } #tc li .ctl, #cm li .ctl, #tc li .h > button, #cm li .h > button, #tc li .h > .val, #cm li .h > .val { flex: none; }
    #tc li .h > button, #cm li .h > button { min-width: 88px; min-height: 44px; font-size: 13px; }
    #tc li[data-st="done"] b, #cm li[data-st="done"] b { color: #a8edb7; } #tc li[data-st="act"] b, #cm li[data-st="act"] b { color: #f0c36a; } #tc li.lock b, #cm li.lock b { color: #8a93a8; } #tc li.lock small.note, #cm li.lock small.note { color: #7c859a; }
    #tc li .bar, #cm li .bar { height: 6px; background: #1c2340; border-radius: 3px; overflow: hidden; margin: 2px 0 4px; } #tc li .bar i, #cm li .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f0c36a, #7be08a); }
    @media (max-width: 640px) {
      .hint { display: none; }
      #bio { left: 12px; right: 12px; top: auto; bottom: 120px; width: auto; max-height: 45vh; }
    }
  </style>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
