<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1226">
  <title>微光小鎮 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1226; }
    canvas { display: block; touch-action: none; image-rendering: pixelated; }
    body { color: #eef1f7; font: 14px/1.45 system-ui, "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif; }
    button { border: 1px solid #ffffff33; background: #1c2440d9; color: #eef1f7; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
    button.on { background: #e8b74a; color: #1c1a14; border-color: #e8b74a; font-weight: 700; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #top { position: fixed; left: 12px; top: 10px; right: 12px; pointer-events: none; text-shadow: 0 1px 3px #000c; }
    #top h1 { margin: 0; font-size: 15px; }
    #top .meta { margin: 2px 0 6px; font-size: 12px; color: #d6dbe6; }
    #top button { pointer-events: auto; }
    #timeline { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(#0d122600, #0d1226e6 30%); }
    #timeline input { width: 100%; margin: 6px 0; accent-color: #e8b74a; }
    #play { width: 40px; font-size: 16px; padding: 4px 0; }
    #ylabel { font-weight: 700; font-size: 15px; min-width: 9em; }
    .hint { color: #aab3c6; font-size: 12px; margin-left: auto; }
    .chips button { font-size: 12px; padding: 4px 8px; }
    /* 標題與關閉鈕固定，只有清單捲動（捲到最近發生的事時不會把標題捲走） */
    #bio { position: fixed; right: 12px; top: 64px; width: min(340px, calc(100vw - 24px)); max-height: calc(100vh - 200px);
      display: flex; flex-direction: column; overflow: hidden;
      background: #141a30f2; border: 1px solid #ffffff26; border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 30px #0008; }
    #bio[hidden] { display: none; }
    #bio ol { overflow: auto; min-height: 0; flex: 1; }
    #bio h2 { margin: 0 24px 2px 0; font-size: 16px; }
    #bio .sub { margin: 0 0 8px; color: #aab3c6; font-size: 12px; }
    #bio ol { margin: 0; padding-left: 0; list-style: none; }
    #bio li { padding: 5px 0; border-top: 1px solid #ffffff14; }
    #bio li b { display: inline-block; min-width: 5.5em; color: #e8b74a; font-weight: 600; }
    #bio li.future { opacity: .38; }
    /* D026：建築卡的處置按鈕（滅火、處理犯罪、治療）；觸控目標 ≥ 44px，沒有處置時整列不佔位 */
    #bio .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    #bio .acts:empty { display: none; }
    #bio .acts button { flex: 1 1 auto; min-height: 44px; padding: 6px 12px; }
    #bio .x { position: absolute; right: 8px; top: 8px; padding: 2px 8px; }
    /* D003：貼上分享碼的對話框 */
    #dlg { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; padding: 16px; }
    #dlg[hidden] { display: none; }
    #dlg .card { width: min(560px, 100%); background: #141a30f5; border: 1px solid #ffffff26; border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px #0008; }
    #dlg h2 { margin: 0 0 4px; font-size: 16px; }
    #dlg .sub { margin: 0 0 8px; color: #aab3c6; font-size: 12px; }
    #dlg textarea { width: 100%; box-sizing: border-box; height: 30vh; resize: vertical; background: #0d1226; color: #eef1f7; border: 1px solid #ffffff33; border-radius: 8px; padding: 8px; font: 12px/1.4 ui-monospace, monospace; word-break: break-all; }
    #dlg .err { color: #ff8a8a; min-height: 1.2em; margin: 6px 0; font-size: 13px; }
    /* D027：☰「幸福構成」面板（實驗線 showStats「幸福構成」的 3D 版）：一項一列，正的綠、負的紅，最負的一項標紅、下面附建議；D028：☰「收支明細」面板（#fin）用同一套樣式 */
    #hs, #fin, #nc, #rk, #pl, #tc, #cm, #ch { position: fixed; inset: 0; z-index: 20; background: #0008; display: flex; align-items: center; justify-content: center; padding: 16px; }
    #hs[hidden], #fin[hidden], #nc[hidden], #rk[hidden], #pl[hidden], #tc[hidden], #cm[hidden], #ch[hidden] { display: none; }
    #hs .card, #fin .card, #nc .card, #rk .card, #pl .card, #tc .card, #cm .card, #ch .card { width: min(460px, 100%); max-height: 86vh; overflow: auto; background: #141a30f5; border: 1px solid #ffffff26; border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px #0008; }
    #hs h2, #fin h2, #nc h2, #rk h2, #pl h2, #tc h2, #cm h2, #ch h2 { margin: 0 0 4px; font-size: 16px; }
    #hs .sub, #fin .sub, #nc .sub, #rk .sub, #pl .sub, #tc .sub, #cm .sub, #ch .sub { margin: 0 0 8px; color: #aab3c6; font-size: 12px; }
    #hs ol, #fin ol, #nc ol, #rk ol, #pl ol, #tc ol, #cm ol, #ch ol { margin: 0; padding: 0; list-style: none; }
    #hs li, #fin li, #nc li, #rk li, #pl li, #tc li, #cm li, #ch li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid #ffffff14; }
    #hs li span.pos, #fin li span.pos, #nc li span.pos, #rk li, #pl li span.pos, #tc li span.pos, #cm li span.pos, #ch li span.pos { color: #7bd88f; } #hs li span.neg, #fin li span.neg, #nc li span.neg, #rk li, #pl li span.neg, #tc li span.neg, #cm li span.neg, #ch li span.neg { color: #ff8a8a; }
    #hs li.bad b, #fin li.bad b, #nc li.bad b, #rk li.bad b, #pl li.bad b, #tc li.bad b, #cm li.bad b, #ch li.bad b { color: #e05252; } #hs li.sum, #fin li.sum, #nc li.sum, #rk li.sum, #pl li.sum, #tc li.sum, #cm li.sum, #ch li.sum { border-top: 1px solid #ffffff40; font-weight: 700; }
    #hs .tip, #fin .tip, #nc .tip, #rk .tip, #pl .tip, #tc .tip, #cm .tip, #ch .tip { color: #e05252; font-size: 12px; margin: 8px 0 0; } #hs .tip:empty, #fin .tip:empty, #nc .tip:empty, #rk .tip:empty, #pl .tip:empty, #tc .tip:empty, #cm .tip:empty, #ch .tip:empty { display: none; }
    #rk .bar { height: 8px; background: #1c2340; border-radius: 4px; overflow: hidden; margin: 2px 0 8px; } #rk .bar i { display: block; height: 100%; background: linear-gradient(90deg, #5ec8ff, #7be08a); }
    #hs .row, #fin .row, #nc .row, #rk .row, #pl .row, #tc .row, #cm .row, #ch .row { margin-top: 10px; } #hs .row button, #fin .row button, #nc .row button, #rk .row, #pl .row button, #tc .row button, #cm .row button, #ch .row button { min-height: 44px; min-width: 72px; }
    /* D032：☰「政策與預算」面板（#pl）：每一列＝名稱＋控制（稅率與預算是 − 倍率 ＋，開關是一顆按鈕）＋一行效果與日費與冷卻；按鈕 44px 以上（手機） */
    #pl .card, #tc .card, #cm .card { width: min(520px, 100%); }
    #pl .head, #tc .head, #cm .head { position: sticky; top: -14px; z-index: 2; margin: -14px -16px 6px; padding: 14px 16px 6px; background: #141a30; border-bottom: 1px solid #ffffff1f; }   /* 標題、日費合計與提示固定在上面（面板很長，捲到下面的政策也看得到冷卻的提示） */
    #pl .foot, #tc .foot, #cm .foot { position: sticky; bottom: -14px; z-index: 2; margin: 8px -16px -14px; padding: 8px 16px 14px; background: #141a30; border-top: 1px solid #ffffff1f; }
    #pl .head .sub, #tc .head .sub, #cm .head .sub { margin-bottom: 2px; } #pl .head .tip, #tc .head .tip, #cm .head .tip { margin: 4px 0 0; }
    #pl h3, #tc h3, #cm h3 { margin: 12px 0 2px; font-size: 13px; color: #aab3c6; font-weight: 600; }

    #tc .tabs, #cm .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 12px 0 4px; }

    #tc .tabs button.on, #cm .tabs button.on { background: #2b4a8a; border-color: #8fb4ff; color: #fff; }

    #tc li .h > button, #cm li .h > button { min-width: 88px; min-height: 44px; font-size: 13px; }
    #tc li[data-st="done"] b, #cm li[data-st="done"] b { color: #a8edb7; } #tc li[data-st="act"] b, #cm li[data-st="act"] b { color: #f0c36a; } #tc li.lock b, #cm li.lock b { color: #8a93a8; } #tc li.lock small.note, #cm li.lock small.note { color: #7c859a; }
    #tc li .bar, #cm li .bar { height: 6px; background: #1c2340; border-radius: 3px; overflow: hidden; margin: 2px 0 4px; } #tc li .bar i, #cm li .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f0c36a, #7be08a); }
    @media (max-width: 640px) {
      .hint { display: none; }
      #bio { left: 12px; right: 12px; top: auto; bottom: 120px; width: auto; max-height: 45vh; }
    }

    /* D091: code-only welcome/loading, isolated from the existing city visuals. */
    #startup { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; overflow: auto; overscroll-behavior: contain; scroll-padding: 24px; box-sizing: border-box; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #101c25; color: #f4eee0; }
    #startup[hidden] { display: none; }
    .startup-card { width: min(980px, 100%); display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #d5b67a40; border-radius: 24px; overflow: hidden; background: #192932; box-shadow: 0 24px 80px #0005; }
    .startup-scene { position: relative; min-height: 440px; background: linear-gradient(155deg, #294654, #142c35); overflow: hidden; }
    .startup-scene > span { position: absolute; bottom: 32px; left: 32px; font-size: 10px; letter-spacing: .3em; color: #d4b981; }
    .startup-moon { position: absolute; top: 60px; right: 58px; width: 70px; height: 70px; border-radius: 50%; background: #e0ca91; box-shadow: 0 0 70px #e0ca9120; }
    .startup-houses { position: absolute; inset: 150px -12px 65px; display: flex; align-items: end; gap: 9px; transform: rotate(-3deg); }
    .startup-houses i { position: relative; flex: 1; height: 130px; background: repeating-linear-gradient(90deg, transparent 0 20px, #e5c37d 20px 30px, transparent 30px 45px) center 35px / 100% 13px no-repeat, #46616a; border-top: 18px solid #24353c; box-shadow: 0 24px 0 #0f232c; }
    .startup-houses i::before { content: ''; position: absolute; top: -48px; left: 0; right: 0; height: 30px; background: #24353c; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .startup-houses i:nth-child(2) { height: 170px; background-color: #667471; }.startup-houses i:nth-child(3) { height: 210px; background-color: #3b545c; }.startup-houses i:nth-child(4) { height: 155px; background-color: #6a665b; }
    .startup-copy { padding: 52px 40px; align-self: center; min-width: 0; }
    .startup-eyebrow { color: #d4b981; font-size: 12px; letter-spacing: .16em; margin: 0 0 20px; }
    #startup h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 600; letter-spacing: .07em; margin: 0 0 24px; }
    #startup h1 span { display: block; font-size: 14px; font-weight: 400; letter-spacing: .04em; margin-top: 12px; color: #c5c8c1; }
    #startup-status { min-height: 3em; color: #e1dccf; line-height: 1.7; margin: 0 0 16px; }
    #startup button { min-height: 48px; width: 100%; border-radius: 10px; background: #d8ba7e; border-color: #d8ba7e; color: #19252c; padding: 12px 18px; font-weight: 700; text-align: left; }
    #startup button span { float: right; } #startup :focus-visible { outline: 3px solid #f7e1ad; outline-offset: 4px; }
    .startup-actions > p, .startup-wait { color: #bdc9ca; font-size: 12px; line-height: 1.7; }
    #startup-storage, #startup-notice { color: #f1ce92; font-size: 13px; line-height: 1.7; }
    #startup details { margin-top: 22px; color: #cad2cf; font-size: 13px; } #startup summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; } #startup details p { line-height: 1.8; }
    .startup-loader { height: 3px; border-radius: 3px; background: #d8ba7e20; overflow: hidden; margin: 24px 0 18px; }
    .startup-loader i { display: block; width: 40%; height: 100%; background: #d8ba7e; transform: translateX(-110%); will-change: transform; animation: startup-drift 1.8s linear infinite; }
    @keyframes startup-drift { to { transform: translateX(360%); } }
    #startup[data-phase="welcome"] .startup-loader, #startup[data-phase="welcome"] .startup-wait, #startup:not([data-phase="welcome"]) .startup-actions, #startup[data-phase="error"] .startup-loader, #startup[data-phase="error"] .startup-wait, .startup-mobile { display: none; }
    @media (max-width: 640px) {
      #startup { padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      .startup-card { max-width: 420px; grid-template-columns: 1fr; border-radius: 18px; }.startup-scene { min-height: 150px; }.startup-moon { width: 42px; height: 42px; top: 20px; right: 35px; }.startup-houses { inset: 65px -12px 18px; transform: scale(.75); transform-origin: bottom; }.startup-houses i { min-width: 50px; }.startup-scene > span { bottom: 12px; left: 20px; font-size: 8px; }.startup-copy { padding: 24px; }.startup-eyebrow { margin-bottom: 12px; }#startup h1 { font-size: 30px; margin-bottom: 18px; }.startup-desktop { display: none; }.startup-mobile { display: block; }#startup details { margin-top: 12px; }
    }
    @media (pointer: coarse) { .startup-desktop { display: none; }.startup-mobile { display: block; } }
    @media (max-height: 500px) { #startup { place-items: start center; }.startup-scene { min-height: 120px; }.startup-copy { padding: 20px 24px; }.startup-eyebrow { margin-bottom: 12px; }#startup h1 { font-size: 28px; margin-bottom: 12px; }#startup h1 span { margin-top: 8px; }#startup-status { min-height: 0; margin-bottom: 12px; }#startup details { margin-top: 8px; }.startup-actions > p { margin: 8px 0; } }
    @media (prefers-reduced-motion: reduce) { .startup-loader i { animation: none; transform: none; width: 100%; opacity: .65; } }
  </style>
</head>
<body>
  <section id="startup" role="dialog" aria-modal="true" aria-busy="true" aria-labelledby="startup-title" aria-describedby="startup-status" data-phase="loading" tabindex="-1">
    <div class="startup-card">
      <div class="startup-scene" aria-hidden="true"><div class="startup-moon"></div><div class="startup-houses"><i></i><i></i><i></i><i></i><i></i></div><span>GLIMMER TOWN · 3D</span></div>
      <div class="startup-copy"><p class="startup-eyebrow">微光之中，自成一城</p><h1 id="startup-title">微光小鎮<span>你的故事，從這裡開始。</span></h1>
        <p id="startup-status" role="status" aria-live="polite" aria-atomic="true">正在準備你的城市…</p>
        <p id="startup-storage" role="status" hidden></p>
        <p id="startup-notice" role="status" hidden></p>
        <div class="startup-loader" aria-hidden="true"><i></i></div>
        <div class="startup-actions"><button id="startup-enter" type="button" disabled>進入小鎮 <span aria-hidden="true">→</span></button><p>城市已準備好，進入即可開始探索。</p></div>
        <button id="startup-retry" type="button" hidden>重新載入</button><p class="startup-wait">載入時間依城市大小與裝置而異，請稍候。</p>
        <details><summary>第一次來？看看操作方式</summary><p class="startup-desktop">滑鼠拖曳移動視角，滾輪縮放；建設工具在畫面下方。</p><p class="startup-mobile">手指拖曳移動視角，雙指縮放；建設工具在畫面下方。</p></details>
        <noscript><p>請啟用 JavaScript 才能進入小鎮。存檔不會被清除。</p></noscript>
      </div>
    </div>
  </section>
  <script id="startup-presentation">
    // Plan A: observe the existing automatic boot. This shell owns no city state.
    (() => {
      const root = document.querySelector('#startup');
      const status = document.querySelector('#startup-status');
      const storage = document.querySelector('#startup-storage');
      const notice = document.querySelector('#startup-notice');
      const enter = document.querySelector('#startup-enter');
      const retry = document.querySelector('#startup-retry');
      const direct = location.search.replace(/^\?/, '').length > 0;
      const previousFocus = document.activeElement;
      const inertBefore = new Map();
      const noticeTexts = new Set();
      const events = ['keydown', 'keypress', 'keyup', 'pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'click', 'dblclick', 'wheel', 'touchstart', 'touchmove', 'touchend', 'contextmenu'];
      let dismissed = false, frame = 0, paintFrame = 0, delayed;

      const shield = () => {
        for (const node of document.body.children) {
          if (node === root || /^(SCRIPT|STYLE)$/.test(node.tagName) || inertBefore.has(node)) continue;
          inertBefore.set(node, node.inert);
          node.inert = true;
        }
      };
      const observeNotices = () => {
        // Retain the engine's existing boot warnings while its toasts expire
        // behind the welcome. Text only; save policy stays entirely in the engine.
        for (const toast of document.querySelectorAll('.gtu #toasts .toast.bad')) {
          const text = toast.textContent;
          if (!text || noticeTexts.has(text)) continue;
          noticeTexts.add(text); notice.textContent = [...noticeTexts].join('\n');
          notice.hidden = false;
        }
      };
      const observer = new MutationObserver(() => { shield(); observeNotices(); });
      observer.observe(document.body, { childList: true, subtree: true });
      shield();
      const controls = () => Array.from(root.querySelectorAll('button:not([disabled]):not([hidden]), summary')).filter(node => node.getClientRects().length > 0);
      const block = event => {
        if (dismissed) return;
        // Keep the engine's window-capture pointer ledger untouched by shell
        // contacts. Native button/summary defaults still produce their click.
        if (root.contains(event.target) && event.type.startsWith('pointer')) {
          event.stopImmediatePropagation(); return;
        }
        if (!root.contains(event.target)) {
          event.preventDefault(); event.stopImmediatePropagation();
        }
        if (event.type === 'keydown' && event.key === 'Tab') {
          const items = controls(), first = items[0], last = items.at(-1);
          if (!items.includes(document.activeElement) || (event.shiftKey && document.activeElement === first) || (!event.shiftKey && document.activeElement === last)) {
            event.preventDefault();
            (event.shiftKey ? last : first)?.focus();
          }
        }
      };
      const contain = event => event.stopPropagation();
      for (const type of events) {
        window.addEventListener(type, block, { capture: true, passive: false });
        root.addEventListener(type, contain);
      }
      const containFocus = event => {
        if (!dismissed && !root.contains(event.target)) (controls()[0] || root).focus();
      };
      window.addEventListener('focusin', containFocus, true);
      root.focus({ preventScroll: true });

      function dismiss() {
        if (dismissed || root.dataset.phase === 'error' || !window.__gt?.ready) return;
        dismissed = true;
        clearTimeout(delayed); cancelAnimationFrame(frame); cancelAnimationFrame(paintFrame);
        observer.disconnect();
        for (const [node, before] of inertBefore) node.inert = before;
        for (const type of events) {
          window.removeEventListener(type, block, true);
          root.removeEventListener(type, contain);
        }
        window.removeEventListener('focusin', containFocus, true);
        window.removeEventListener('error', failed, true);
        window.removeEventListener('unhandledrejection', failed);
        if (root.contains(document.activeElement)) document.activeElement.blur();
        root.hidden = true;
        if (previousFocus !== document.body && previousFocus?.isConnected) previousFocus.focus({ preventScroll: true });
      }
      function failed(event) {
        if (dismissed || window.__gt?.ready || root.dataset.phase === 'error') return;
        // Resource/module errors and uncaught startup errors are observable failures.
        if (event.type === 'error' && event.target !== window && event.target?.tagName !== 'SCRIPT') return;
        cancelAnimationFrame(frame); cancelAnimationFrame(paintFrame); clearTimeout(delayed);
        root.dataset.phase = 'error'; root.setAttribute('aria-busy', 'false');
        status.textContent = '小鎮暫時未能開啟。請重新載入再試。';
        retry.hidden = false; retry.focus({ preventScroll: true });
      }
      window.addEventListener('error', failed, true);
      window.addEventListener('unhandledrejection', failed);
      enter.addEventListener('click', () => {
        if (root.dataset.phase === 'welcome') dismiss();
      });
      retry.addEventListener('click', () => {
        retry.disabled = true;
        location.reload();
      });
      delayed = setTimeout(() => {
        if (root.dataset.phase !== 'loading') return;
        status.textContent = '城市仍在準備中。你可以繼續等候，或重新載入再試。';
        retry.hidden = false;
      }, 45000);
      function observeReady() {
        if (dismissed || root.dataset.phase === 'error') return;
        if (!window.__gt?.ready) { frame = requestAnimationFrame(observeReady); return; }
        clearTimeout(delayed);
        status.textContent = '城市已就緒，正在等待畫面更新…';
        // These are actual paint opportunities, not a renderer completion promise.
        paintFrame = requestAnimationFrame(() => {
          paintFrame = requestAnimationFrame(() => {
            if (dismissed || root.dataset.phase === 'error') return;
            if (typeof window.__gt.journal === 'function') {
              const journal = window.__gt.journal();
              if (!journal.kind || journal.why) {
                storage.textContent = '世界歷史日誌暫不可用或讀取不完整。' + (journal.why ? '原因：' + journal.why : '');
                storage.hidden = false;
              }
            }
            if (direct) { dismiss(); return; }
            root.dataset.phase = 'welcome'; root.setAttribute('aria-busy', 'false');
            status.textContent = '小鎮已準備好，開始你的下一段故事。';
            retry.hidden = true; enter.disabled = false;
            enter.focus({ preventScroll: true });
          });
        });
      }
      frame = requestAnimationFrame(observeReady);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
