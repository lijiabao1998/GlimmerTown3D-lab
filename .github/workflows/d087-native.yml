name: D087 native British working rural eleven
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: d087-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exact current source, inherited assertions, all native and browser negative controls
        run: node proposals/d088/inherited-test-runner.mjs --suite=d087
      - run: npm run typecheck
      - name: Actual immutable published157 baseline
        run: |
          git worktree add --detach ../GlimmerTown3D-lab-d087-baseline b4275bda73e72a9fb48343376fccaab52bbc8e84
          ln -s "$PWD/node_modules" ../GlimmerTown3D-lab-d087-baseline/node_modules
      - name: Original157 byte identities and eleven distinct complete native buildings
        run: |
          node proposals/d087/model-audit.mjs --baseline
          node proposals/d087/model-audit.mjs
      - name: Every current old scene and eleven/forty-four native owners retain budgets
        run: node proposals/d087/scene-budget-check.mjs --label=ci
      - name: Reproduce exact signed-zero-safe procedural mesh cache
        run: |
          node proposals/d087/precompiled-cache-qualification.mjs src/render/britishWorkingRuralModels.mjs fixtures/d087/compiled-cache.json
          node proposals/d087/precompiled-cache-parity.mjs
      - name: Current old D083 eight and D086 ten native regressions
        run: |
          node proposals/d083/native-integration-check-d088.mjs
          node proposals/d086/native-variant-check-d088.mjs
          node proposals/d088/native-current-inherited-ui-guards.mjs
      - name: Exact current native product and immutable published baseline builds
        run: |
          node proposals/d087/native-browser-build.mjs --attempt=1
          (cd ../GlimmerTown3D-lab-d087-baseline && node proposals/d086/native-browser-build.mjs --attempt=1)
          mkdir scratch/d087-native-build/attempt-1/baseline
          cp ../GlimmerTown3D-lab-d087-baseline/scratch/d086-native-build/attempt-1/index.html ../GlimmerTown3D-lab-d087-baseline/scratch/d086-native-build/attempt-1/provenance.json scratch/d087-native-build/attempt-1/baseline/
          printf '%s\n' "$GITHUB_SHA" > scratch/d087-native-build/attempt-1/source-commit.txt
          (cd scratch/d087-native-build/attempt-1 && sha256sum index.html provenance.json baseline/index.html baseline/provenance.json > index.sha256)
      - uses: actions/upload-artifact@v4
        id: build
        with:
          name: d087-native-build-${{ github.sha }}
          path: scratch/d087-native-build/attempt-1/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d087-native-node-${{ github.sha }}
          path: |
            scratch/d087-*/
            scratch/d088-inherited-tests-d087/
            scratch/d088-native/
            scratch/d083-native-evidence/
            scratch/d086-native-variant/
          if-no-files-found: error
          retention-days: 30
  native-game:
    needs: native-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 412, 360]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native-and-build.outputs.artifact-id }}
          path: scratch/d087-native-build/attempt-1/
          merge-multiple: true
      - name: Verify exact same build and source SHA
        run: |
          test "$(cat scratch/d087-native-build/attempt-1/source-commit.txt)" = "$GITHUB_SHA"
          (cd scratch/d087-native-build/attempt-1 && sha256sum --check index.sha256)
      - name: Real catalogue, eleven mouse/touch placements, construction, picking and save reload
        run: node proposals/d087/native-browser-check-d088.mjs --width=${{ matrix.width }} --attempt=1
      - name: Every original raw PNG and independent complete production frame join
        run: node proposals/d087/browser-frame-qualification.mjs --manifest=scratch/d087-native-evidence/browser-${{ matrix.width }}-attempt-1/manifest.json
      - name: Every required surface joins actual legal-player raw PNG and full native Uint32 arrays
        run: node proposals/d087/browser-surface-qualification.mjs --manifest=scratch/d087-native-evidence/browser-${{ matrix.width }}-attempt-1/manifest.json --build=scratch/d087-native-build/attempt-1 --cache-manifest=fixtures/d087/compiled-cache.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d087-native-game-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d087-native-evidence/
          if-no-files-found: error
          retention-days: 30
  native-input-performance:
    needs: native-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 412, 360]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native-and-build.outputs.artifact-id }}
          path: scratch/d087-native-build/attempt-1/
          merge-multiple: true
      - name: Verify exact same build and source SHA
        run: |
          test "$(cat scratch/d087-native-build/attempt-1/source-commit.txt)" = "$GITHUB_SHA"
          (cd scratch/d087-native-build/attempt-1 && sha256sum --check index.sha256)
      - name: Fresh actual page CPU6 first use and all33 distinct commits per width
        run: node proposals/d087/native-first-use-cache-check.mjs --width=${{ matrix.width }} --attempt=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d087-native-first-use-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d087-native-evidence/
          if-no-files-found: error
          retention-days: 30
  native-startup-cache:
    needs: native-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 412, 360]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native-and-build.outputs.artifact-id }}
          path: scratch/d087-native-build/attempt-1/
          merge-multiple: true
      - name: Verify exact same build and source SHA
        run: |
          test "$(cat scratch/d087-native-build/attempt-1/source-commit.txt)" = "$GITHUB_SHA"
          (cd scratch/d087-native-build/attempt-1 && sha256sum --check index.sha256)
      - name: Eight fresh profiles per width, original startup bound and empty-cache evidence
        run: node proposals/d087/native-startup-cache-check.mjs --width=${{ matrix.width }} --attempt=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d087-native-startup-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d087-native-evidence/
          if-no-files-found: error
          retention-days: 30
  surface-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Independent complete solids, every facade and genuine bank route
        run: node --test proposals/d087/geometry-focused.test.mjs proposals/d087/geometry-access.test.mjs
      - name: All33 complete original-D081 native contracts, no omitted probes or alternate camera
        run: node proposals/d087/native-surface-plan.mjs --label=ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d087-native-surfaces-${{ github.sha }}
          path: scratch/d087-surface/
          if-no-files-found: error
          retention-days: 30
