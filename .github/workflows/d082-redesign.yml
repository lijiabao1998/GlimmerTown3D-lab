name: D082 two-sample art review (no deployment)
on:
  push:
    branches: ['codex/d082-art-redesign']
permissions:
  contents: read
concurrency:
  group: d082-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-sample-production-review:
    # This is not final D082 acceptance. Existing ten-model gates are unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 412, 360]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - name: Two prototypes, eight unchanged rejected slots, independent production frames
        run: node --experimental-strip-types tools/d082-redesign-check.mjs
      - run: npm run build
      - name: Actual production original, context, front, rear and side PNGs
        run: node --experimental-strip-types tools/d082-redesign-capture.mjs
        env:
          D082_REDESIGN_WIDTHS: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d082-two-sample-art-review-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d082-redesign/
          if-no-files-found: error
          retention-days: 30
