name: D074 native touch release diagnostic (no deployment)
on:
  push:
    branches: ['codex/d074-touch-repair']
permissions:
  contents: read
concurrency:
  group: d074-touch-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Original full smoke context with bounded D052 tracing
        run: node tools/d074-full-context-diagnostic.mjs 2>&1 | tee full-context-smoke-run.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d074-touch-diagnostic-${{ github.sha }}
          path: |
            scratch/d074-full-context-diagnostic/
            scratch/shots/
            full-context-smoke-run.txt
          if-no-files-found: error
          retention-days: 14
