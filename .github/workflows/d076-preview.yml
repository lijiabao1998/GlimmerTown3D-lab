name: D076 ten British health and response saved-slot preview (no deployment)
on:
  push:
    branches: ['codex/d076-british-ten', 'codex/d076-inspection']
permissions:
  contents: read
concurrency:
  group: d076-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/codex/d076-british-ten' || github.ref == 'refs/heads/codex/d076-inspection'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 360, 412]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch immutable D066 through D076 source-scope baselines
        run: |
          git fetch --no-tags --depth=1 origin 94024b6e2195f4d545de1f1af770dfbe98c1777a
          git fetch --no-tags --depth=1 origin beca506c224ad72f9a890ed20b5aa1fa7b2616f5
          git fetch --no-tags --depth=1 origin a5674d9bdbfbf439319b50e26c3f864864ab5363
          git fetch --no-tags --depth=1 origin a69397ed0900b1f0a27bdc3be8e1616d2973fc43
          git fetch --no-tags --depth=1 origin f689c35d8d061498779321149ccce4443f0ce6de
          git fetch --no-tags --depth=1 origin 1c40e13a219adb90827acd3b60fb6b7623600b63
          git fetch --no-tags --depth=1 origin bece722ed2480a3728a274c90bd0170eb52cf389
          git fetch --no-tags --depth=1 origin ee07f108448c5a1068c0c7b1c0ca6ed7d4cad883
          git fetch --no-tags --depth=1 origin 3527859dfa4d802fda0eaa4a0d96aa05e1471a2d
          git fetch --no-tags --depth=1 origin 91e499b6c0ed0ce0cffdf0c09a35a067a8156c71
          git fetch --no-tags --depth=1 origin e3cf7c3515602d5fe0dbeeaa91d8a27fc25f5e69
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Local Chinese fonts for factual image captions
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - name: Focused geometry, legacy, source scope, picking and negative controls
        run: node tools/unit-d076.mjs && node tools/unit-d076-frame.mjs && node tools/unit-d074.mjs && node tools/unit-d074-frame.mjs && node tools/unit-d074-touch-repair.mjs && node tools/d074-touch-repair-scope.mjs && node tools/unit-d073.mjs && node tools/unit-d073-frame.mjs && node tools/unit-d072.mjs && node tools/unit-d072-frame.mjs && node tools/unit-d071.mjs && node tools/unit-d071-frame.mjs && node tools/unit-d070.mjs && node tools/unit-d070-frame.mjs && node tools/unit-d069.mjs && node tools/unit-d069-frame.mjs && node tools/unit-d068.mjs && node tools/unit-d068-frame.mjs && node tools/unit-d067.mjs && node tools/unit-d067-frame.mjs && node tools/unit-d066.mjs && node tools/unit-d065.mjs
      - run: npm run build
      - name: Validate exact source coverage without claiming screenshots
        run: node tools/d076-capture.mjs --plan-only
        env:
          D076_WIDTHS: ${{ matrix.width }}
      - name: Real same-world WebGL pairs (copied health and response saved-slot showcase; existing cities controls)
        run: node tools/d076-capture.mjs
        env:
          D076_WIDTHS: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d076-british-ten-${{ matrix.width }}-${{ github.sha }}
          path: |
            scratch/d076/
            scratch/d066/D066-unit.json
            scratch/d065/D065-unit.json
          if-no-files-found: error
          retention-days: 14
