name: transit

# D099 transit product gate. Separate from the frozen D083/D086-D090 release
# workflows: this runs only the transit source lease, the v3 current suite and
# the transit prototype rules, so product work does not have to edit ci.yml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transit-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: D099 source lease and v3 current suite
        run: |
          node --test tools/d099-source.test.mjs
          node --test tools/d090-source-v3.test.mjs
          node --test proposals/d090/source-boundaries-v3.test.mjs
      - name: D097 transit prototype rules
        run: |
          node tools/unit-d097-graph.mjs
          node tools/unit-d097-movement.mjs
      - name: D100 network construction guards
        run: node tools/unit-d100-network.mjs
      - run: npx tsc --noEmit
