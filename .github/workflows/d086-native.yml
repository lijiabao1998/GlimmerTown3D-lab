name: D086 native British civic markets
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: d086-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Source leases, finite current versions and mandatory release graph negatives
        run: node proposals/d087/inherited-test-runner.mjs
      - run: npm run typecheck
      - name: Immutable immediate baseline and original affected historical contracts
        run: |
          git worktree add --detach ../GlimmerTown3D-lab-d086-baseline 77b8616382f6115711b2b8eb39735a769b859cde
          ln -s "$PWD/node_modules" ../GlimmerTown3D-lab-d086-baseline/node_modules
          node proposals/d086/historical-contracts.mjs
      - name: Immutable unaccepted first-candidate source, facade and structural assertions
        run: |
          git worktree add --detach ../GlimmerTown3D-lab-d086-first-candidate 4b0bbcdafaa3b3df615633c7eb2fa236242f07fc
          ln -s "$PWD/node_modules" ../GlimmerTown3D-lab-d086-first-candidate/node_modules
          node proposals/d086/first-candidate-contracts.mjs
      - name: Immutable immediate geometry V2 source, facade, structural and workflow assertions
        run: |
          git worktree add --detach ../GlimmerTown3D-lab-d086-geometry-v2 207404e1479593cd748b6e71bbe9c2d7e3c1042a
          ln -s "$PWD/node_modules" ../GlimmerTown3D-lab-d086-geometry-v2/node_modules
          node proposals/d086/geometry-v2-contracts.mjs
      - name: Actual immutable V3 source and historical assertion groups
        run: |
          git worktree add --detach ../GlimmerTown3D-lab-d086-geometry-v3 cc8280f30e7b4115c6ffff2df27ca6ca7aa0baba
          ln -s "$PWD/node_modules" ../GlimmerTown3D-lab-d086-geometry-v3/node_modules
          node proposals/d086/geometry-v3-contracts.mjs --label=ci
      - name: Actual immutable V4 cache and original inherited coastal integration
        run: |
          git worktree add --detach ../GlimmerTown3D-lab-d086-cache-v4 f636cfa0bb89b4336551840f647d14914759f97c
          ln -s "$PWD/node_modules" ../GlimmerTown3D-lab-d086-cache-v4/node_modules
          node proposals/d086/cache-v4-contracts.mjs --label=ci
          node proposals/d086/coastal-accepted-nine-historical.mjs --label=ci
      - name: Actual immutable V5 source, full cache and ordinary-player surface contracts
        run: |
          git worktree add --detach ../GlimmerTown3D-lab-d086-cache-v5 fae5c91611b8af0a407e5ddadf6fbb07bf59b6f9
          ln -s "$PWD/node_modules" ../GlimmerTown3D-lab-d086-cache-v5/node_modules
          node proposals/d086/cache-v5-contracts.mjs --label=ci
      - name: Reproducible exact procedural cache including all signed-zero payload bytes
        run: node proposals/d086/precompiled-cache-v6-qualification.mjs src/render/britishCivicMarketModels.mjs fixtures/d086/compiled-cache-v6.json
      - name: Exact production geometry parity and optimized compile negative controls
        run: |
          node proposals/d086/precompiled-cache-v6-parity.mjs
          node proposals/d086/compile-optimization-invariants.mjs src/render/britishCivicMarketModels.mjs scratch/d086-cache-v6-parity/invariants.json
      - name: Actual prior147 binary and all157 canonical architectural identities
        run: |
          node proposals/d086/model-audit.mjs --baseline
          node proposals/d086/model-audit.mjs
          node proposals/british-program/ledger-check.mjs
      - name: Current and immutable old production scenes, exact owner ledger and unchanged frame ceilings
        run: node proposals/d086/scene-budget-check.mjs --label=ci
      - name: Current closed meshes, architectural facade backing and negative controls
        run: |
          node proposals/d086/mesh-check.mjs
          node proposals/d086/facade-imprint-v4-check.mjs --label=ci
      - name: Current native fiscal, services, RNG, history, save, construction and undo
        run: node proposals/d086/native-variant-check-d087.mjs
      - name: Current catalogue54 retains all original43 interactions and negative controls
        run: |
          node tools/unit-d053-d087.mjs
          node proposals/d087/native-current-food-guards.mjs
      - name: Current inherited research, construction UI and touch lease negative controls
        run: node proposals/d087/native-current-inherited-ui-guards.mjs
      - name: Actual native product build with exact source identity
        run: |
          node proposals/d086/native-browser-build.mjs --attempt=1
          (cd ../GlimmerTown3D-lab-d086-geometry-v3 && node proposals/d086/native-browser-build.mjs --attempt=1)
          mkdir scratch/d086-native-build/attempt-1/baseline
          cp ../GlimmerTown3D-lab-d086-geometry-v3/scratch/d086-native-build/attempt-1/index.html ../GlimmerTown3D-lab-d086-geometry-v3/scratch/d086-native-build/attempt-1/provenance.json scratch/d086-native-build/attempt-1/baseline/
          printf '%s\n' "$GITHUB_SHA" > scratch/d086-native-build/attempt-1/source-commit.txt
          (cd scratch/d086-native-build/attempt-1 && sha256sum index.html provenance.json baseline/index.html baseline/provenance.json > index.sha256)
      - uses: actions/upload-artifact@v4
        id: build
        with:
          name: d086-native-build-${{ github.sha }}
          path: scratch/d086-native-build/attempt-1/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d086-native-node-${{ github.sha }}
          path: |
            scratch/d086-audit/
            scratch/d087-inherited-tests/
            scratch/d087-native/
            scratch/d086-mesh/
            scratch/d086-native-variant/
            scratch/d086-historical/
            scratch/d086-first-candidate-contracts/
            scratch/d086-geometry-v2-contracts/
            scratch/d086-cache-v6-parity/*.json
            scratch/d086-cache-v6-parity/*.log
            scratch/d086-cache-v4-contracts/
            scratch/d086-cache-v5-contracts/
            scratch/d086-coastal-accepted-nine-history/
            scratch/d086-geometry-v3-contracts/
            scratch/d086-facade-imprint/
            scratch/d086-scene-budget/
          if-no-files-found: error
          retention-days: 30
  native-game:
    needs: native-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 412, 360]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native-and-build.outputs.artifact-id }}
          path: scratch/d086-native-build/attempt-1/
          merge-multiple: true
      - name: Verify exact same build and source SHA
        run: |
          test "$(cat scratch/d086-native-build/attempt-1/source-commit.txt)" = "$GITHUB_SHA"
          (cd scratch/d086-native-build/attempt-1 && sha256sum --check index.sha256)
      - name: Real catalogue, mouse/touch placement, construction, picking, front/back and save reload
        run: node proposals/d086/native-browser-v6-check-d087.mjs --width=${{ matrix.width }} --attempt=1
      - name: Exact real raw PNG inventory and independent production frame join
        run: node proposals/d086/browser-frame-qualification.mjs --manifest=scratch/d086-native-evidence/browser-${{ matrix.width }}-attempt-1/manifest.json
      - name: Every original required surface joins actual ordinary-player PNGs and native full-scene frames
        run: node proposals/d086/browser-surface-qualification-v7.mjs --manifest=scratch/d086-native-evidence/browser-${{ matrix.width }}-attempt-1/manifest.json --build=scratch/d086-native-build/attempt-1 --cache-manifest=fixtures/d086/compiled-cache-v6.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d086-native-game-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d086-native-evidence/
          if-no-files-found: error
          retention-days: 30
  native-input-performance:
    needs: native-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 412, 360]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native-and-build.outputs.artifact-id }}
          path: scratch/d086-native-build/attempt-1/
          merge-multiple: true
      - name: Verify exact same build and source SHA
        run: |
          test "$(cat scratch/d086-native-build/attempt-1/source-commit.txt)" = "$GITHUB_SHA"
          (cd scratch/d086-native-build/attempt-1 && sha256sum --check index.sha256)
      - name: Separate fresh native page first-use CPU6 and thirty actual commits
        run: node proposals/d086/native-first-use-cache-check-v6.mjs --width=${{ matrix.width }} --attempt=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d086-native-first-use-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d086-native-evidence/
          if-no-files-found: error
          retention-days: 30
  native-startup-cache:
    needs: native-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 412, 360]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native-and-build.outputs.artifact-id }}
          path: scratch/d086-native-build/attempt-1/
          merge-multiple: true
      - name: Verify exact same build and source SHA
        run: |
          test "$(cat scratch/d086-native-build/attempt-1/source-commit.txt)" = "$GITHUB_SHA"
          (cd scratch/d086-native-build/attempt-1 && sha256sum --check index.sha256)
      - name: Fresh-profile load, parse, CPU1/CPU6 startup and zero prewarm measurements
        run: node proposals/d086/native-startup-cache-check-v6.mjs --width=${{ matrix.width }} --attempt=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d086-native-startup-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d086-native-evidence/
          if-no-files-found: error
          retention-days: 30
  surface-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Independent numerical wall and roof plan, topology and unchanged camera negatives
        run: |
          node --test proposals/d086/structural-plan-v7.test.mjs proposals/d086/structural-plan-v2.test.mjs
          node proposals/d086/structural-plan-v7-check.mjs --label=ci
      - name: Every unchanged full-scene required surface remains mandatory
        run: node proposals/d086/native-surface-plan-v7.mjs --label=ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d086-native-surfaces-${{ github.sha }}
          path: scratch/d086-surface/
          if-no-files-found: error
          retention-days: 30
