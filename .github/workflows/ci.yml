# QA-only diagnostics. Never merge. Full candidate aggregate remains required.
name: D048 focused browser verification
on:
  push:
    branches: ['claude/d048-focused-verification']
permissions:
  contents: read
jobs:
  observe:
    if: github.ref == 'refs/heads/claude/d048-focused-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Product and all other guards remain unchanged
        run: git diff --exit-code 8b3ba071ebba84245fc32ee114cca1b2132b3839 HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)tools/d048-scenes.mjs' ':(exclude)tools/smoke-d048.mjs'
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck && npm run build
      - name: Same candidate HTML
        run: echo 'cbd5ea3d1235042b9407769fc7bb1d8535a09f9ea43ef5173d15907be9213cec  dist/index.html' | sha256sum --check
      - name: All D048 browser sections (focused diagnostics, not full aggregate)
        shell: bash
        run: node tools/smoke-d048.mjs 2>&1 | tee d048-focused-run.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d048-focused-${{ github.sha }}
          path: |
            d048-focused-run.txt
            scratch/shots/D048-*.png
            scratch/shots/D048-evidence.json
          retention-days: 14
