          cache: npm
      - run: npm ci
      - name: 中文字型（履歷卡與樣張的版面才會跟手機一致）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
      - name: Verify exact same-run build and source identity
        run: node .github/scripts/ci-integrity.mjs verify
        env:
          CI_BUILD_DIGEST: ${{ needs.build.outputs.digest }}
      - name: 拍樣張（三畫風×三年份×兩個距離）
        run: node tools/shoot.mjs --out=scratch/shots
      - uses: actions/upload-artifact@v4
        id: evidence
