# Baseline QA only. Never merge; no deployment job or permissions.
name: D048 approved baseline capture
on:
  push:
    branches: ['claude/d048-baseline-capture']
permissions:
  contents: read
jobs:
  capture:
    if: github.ref == 'refs/heads/claude/d048-baseline-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pinned original product and test source
        run: git diff --exit-code 0f38eff100f9161730e2208bcc24b896874dfa83 HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)tools/d048-scenes.mjs' ':(exclude)tools/capture-d048-baseline.mjs'
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: Capture actual approved public page
        shell: bash
        run: node tools/capture-d048-baseline.mjs 2>&1 | tee baseline-run.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d048-baseline-${{ github.sha }}
          path: |
            baseline-run.txt
            scratch/d048-baseline/*
          retention-days: 14
