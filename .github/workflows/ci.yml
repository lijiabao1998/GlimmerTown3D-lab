  pages:
    needs: [smoke, d055, d059, d060, d061, d062, d063, d064, d068, d069, d070, d071, d072, d073, d074, d076, d077, d078]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
