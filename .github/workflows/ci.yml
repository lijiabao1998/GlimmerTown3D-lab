# QA only. Never merge this branch. This workflow cannot deploy.
name: D052 official verification
on:
  push:
    branches: ['claude/d052-live-verification']
permissions:
  contents: read
concurrency:
  group: d052-official-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/claude/d052-live-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chinese fonts for exact approved screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Actual official HTML, unchanged D052 suite and approved images
        shell: bash
        run: |
          mkdir -p scratch/live-d052
          node tools/verify-live-d052.mjs 2>&1 | tee scratch/live-d052/live-run.txt
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d052-official-verification
          path: |
            scratch/live-d052/*.json
            scratch/live-d052/*.txt
            scratch/shots/D052-*.png
            scratch/shots/D052-*.json
            scratch/shots/D052-*.code.txt
          if-no-files-found: error
          retention-days: 14
