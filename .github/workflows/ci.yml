# QA-only capture on an unchanged product. Never merge or deploy this branch.
name: D051 baseline capture
on:
  push:
    branches: ['claude/d051-baseline-capture']
permissions:
  contents: read
concurrency:
  group: d051-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Existing Chinese font package for consistent screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Verify baseline HTML and capture two genuine Chrome views
        run: node tools/capture-d051-baseline.mjs 2>&1 | tee d051-baseline-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d051-baseline-${{ github.sha }}
          path: |
            d051-baseline-run.txt
            scratch/d051-baseline/
            tools/d051-scenes.mjs
            tools/capture-d051-baseline.mjs
          if-no-files-found: error
          retention-days: 14
