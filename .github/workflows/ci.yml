# QA-only branch. Never merge. No Pages job, environment, or deploy permission.
name: D049 official Pages verification
on:
  push:
    branches: ['claude/d049-live-verification']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d049-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/claude/d049-live-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Approved product and original test suite are unchanged
        shell: bash
        run: |
          set -euo pipefail
          approved=960b3e329717d7895bf788f0e095b1efee1dcc82
          release=71bf40db307663c2713ec6a83c2aa4c327e5c7ca
          tree=32226116bbe345d3415a00f309d9b851a3c8651f
          test "$(git rev-parse "$approved^{tree}")" = "$tree"
          test "$(git rev-parse "$release^{tree}")" = "$tree"
          git diff --exit-code "$release" HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)tools/verify-live-d049.mjs'
      - run: npm ci
      - name: Existing Chinese screenshot font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Approved single-file build SHA256
        shell: bash
        run: echo '68d825da457c2f64dec5b72da04fbda0dac131fbe8ff9f00b785f1a21f6bb000  dist/index.html' | sha256sum --check
      - name: Local source and verifier guard preflight
        run: node tools/verify-live-d049.mjs --preflight
      - name: Actual official Pages trusted-input and copy-feedback verification
        shell: bash
        run: mkdir -p scratch/live-d049; node tools/verify-live-d049.mjs 2>&1 | tee scratch/live-d049/live-run.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d049-live-${{ github.sha }}
          path: |
            scratch/live-d049/live-run.txt
            scratch/live-d049/report.json
            scratch/shots/D049-*.png
            scratch/shots/D049-evidence.json
          if-no-files-found: warn
          retention-days: 14
