# Candidate-only early QA. Full aggregate CI remains unchanged on the candidate branch.
name: d054-preflight
on:
  push:
    branches: ['claude/qa-d054-preflight']
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chinese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck && node tools/unit-d054.mjs && node tools/unit-d054-ui.mjs
      - run: npm run build
      - name: Native site diagnostics and immutable prior screenshot guards
        run: |
          node --input-type=module <<'JS' 2>&1 | tee d054-preflight-run.txt
          import { withBrowser } from './tools/cdp.mjs';
          import { d054Smoke } from './tools/smoke-d054.mjs';
          import { d049Smoke } from './tools/smoke-d049.mjs';
          import { d050Smoke, d050CopyImageGuard } from './tools/smoke-d050.mjs';
          import { d051ImportImageGuard } from './tools/smoke-d051.mjs';
          let passed=0,failed=0;const log=(ok,name,detail)=>{console.log(ok?'OK':'NG',name,detail??'');if(ok)passed++;else failed++;};
          await d054Smoke(withBrowser,log);
          await d049Smoke(withBrowser,log);
          await d050Smoke(withBrowser,log);
          d050CopyImageGuard(log);d051ImportImageGuard(log);
          console.log(JSON.stringify({passed,failed}));process.exitCode=failed?1:0;
          JS
          exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d054-preflight-${{ github.sha }}
          path: |
            d054-preflight-run.txt
            scratch/shots
          if-no-files-found: error
          retention-days: 14
