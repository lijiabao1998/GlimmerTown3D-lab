# QA-only branch. Never merge. No Pages job, environment, or deploy permission.
name: D050 official Pages verification
on:
  push:
    branches: ['claude/d050-live-verification']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d050-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/claude/d050-live-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Approved product and original test suite are unchanged
        shell: bash
        run: |
          set -euo pipefail
          approved=a8c0fbe34339272c17166163277e454262594187
          release=f8241f6c3ab3ede932f695580cee3297ae256339
          tree=3ac27736d0b60bb9f14d490ff9951fdd92a3447c
          test "$(git rev-parse "$approved^{tree}")" = "$tree"
          test "$(git rev-parse "$release^{tree}")" = "$tree"
          git diff --exit-code "$release" HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)tools/verify-live-d050.mjs'
      - run: npm ci
      - name: Existing Chinese screenshot font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Approved single-file build SHA256
        shell: bash
        run: echo '382e407eb48c05eb1b200b98ce7cf37ef73df89247627eb6a9a1832d8bc25610  dist/index.html' | sha256sum --check
      - name: Local source and verifier guard preflight
        run: node tools/verify-live-d050.mjs --preflight
      - name: Actual official Pages trusted-input and import-retry verification
        shell: bash
        run: mkdir -p scratch/live-d050; node tools/verify-live-d050.mjs 2>&1 | tee scratch/live-d050/live-run.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d050-live-${{ github.sha }}
          path: |
            scratch/live-d050/live-run.txt
            scratch/live-d050/report.json
            scratch/shots/D050-*.png
            scratch/shots/D050-evidence.json
          if-no-files-found: warn
          retention-days: 14
