  smoke:
    needs: [build, node, node-frame, node-frame-d079, node-frame-d080, node-frame-d081, node-frame-d082, browser, screenshots]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require every split verification stage and evidence artifact
        run: node .github/scripts/ci-integrity.mjs gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - name: Restore browser evidence (including failed-run diagnostics)
        if: always() && needs.browser.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.browser.outputs.artifact-id }}
          merge-multiple: true
      - name: Restore screenshot evidence after browser evidence (original order)
        if: always() && needs.screenshots.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.screenshots.outputs.artifact-id }}
          path: scratch/shots
          merge-multiple: true
      - uses: actions/upload-artifact@v4
