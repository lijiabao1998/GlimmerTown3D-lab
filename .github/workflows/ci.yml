# QA only. Never merge. No write permissions or Pages/deploy job.
# Parent creates this branch only after image-approved main CI/Pages succeeds.
name: D053 official verification
on:
  push:
    branches: ['claude/d053-live-verification']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d053-official-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/claude/d053-live-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chinese fonts for exact approved PNGs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Offline QA adapter negative checks; no browser launch
        run: node tools/verify-live-d053.mjs --self-test
      - name: Actual official HTML, unchanged D053 native suite and approved images
        shell: bash
        run: |
          mkdir -p scratch/live-d053
          node tools/verify-live-d053.mjs 2>&1 | tee scratch/live-d053/live-run.txt
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d053-official-verification
          path: |
            scratch/live-d053/*.json
            scratch/live-d053/*.txt
            scratch/shots/D053-*.png
            scratch/shots/D053-*.json
            scratch/shots/D053-*.code.txt
            scratch/shots/D053-*.html
          if-no-files-found: error
          retention-days: 14
