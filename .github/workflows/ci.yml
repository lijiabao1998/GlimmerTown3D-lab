name: d054-recovery-fixed
on:
  push:
    branches: ['claude/qa-d054-recovery-fixed']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck && node tools/unit-d054.mjs && node tools/unit-d054-ui.mjs
      - run: npm run build
      - name: Exact original highway gesture now succeeds
        run: node tools/d054-recovery-probe.mjs --phase=fixed --expect-hash=c3d36cbaed0ebfcaafab7db2989975502be8d6501845f025bd4ec473e71e9777 --require-built=1
      - name: Original D011 build and native surfaces and budget
        run: D011_SMOKE_ONLY=build,budget,touch node tools/smoke-d011.mjs 2>&1 | tee d011-recovery-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Complete D054 native acceptance including first-input16ms
        if: always()
        run: node tools/smoke-d054.mjs 2>&1 | tee d054-recovery-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d054-recovery-fixed-${{ github.sha }}
          path: |
            d011-recovery-run.txt
            d054-recovery-run.txt
            scratch/shots
          if-no-files-found: error
          retention-days: 14
