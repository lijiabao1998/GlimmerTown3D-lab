# QA only. Never merge this branch. This workflow cannot deploy.
name: D051 official verification
on:
  push:
    branches: ['claude/d051-live-verification']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d051-official-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chinese fonts for exact approved screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Actual official HTML, unchanged D051 suite and approved images
        shell: bash
        run: |
          mkdir -p scratch/live-d051
          node tools/verify-live-d051.mjs 2>&1 | tee scratch/live-d051/live-run.txt
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d051-official-verification
          path: |
            scratch/live-d051/*.json
            scratch/live-d051/*.txt
            scratch/shots/D051-*.png
            scratch/shots/D051-evidence.json
          if-no-files-found: error
          retention-days: 14
