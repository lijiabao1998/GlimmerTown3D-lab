# QA only. No product changes, no permissions to write, never merge or deploy.
name: D055 original baseline
on:
  push:
    branches: ['claude/d055-baseline']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck && npm run build
      - name: Immutable D054 originals and native baseline
        run: node tools/d055-capture.mjs --phase=before
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d055-original-baseline
          path: scratch/d055-before/*
          if-no-files-found: error
          retention-days: 14
