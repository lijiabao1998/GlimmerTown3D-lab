# 每次推送：型別檢查 → Node 端守衛 → 建置單檔 → 無頭 Chrome 煙霧測試（WebGL 走 SwiftShader，雲端沒有 GPU 也能跑）→ 拍九張樣張當附件。
# main 綠燈之後把 dist/index.html 發到 GitHub Pages：手機直接開網址就能看、能轉。
name: ci

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 120   # D054 起 90；D065 發布時 main CI（run 38701592327）跑 91:40 被逾時取消（之前三次 80:37／88:44／89:10，餘量不到 1 分鐘）。只加總時間預算，任何檢查與門檻不變。
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable D066 through D070 source-scope baselines
        run: |
          git fetch --no-tags --depth=1 origin bece722ed2480a3728a274c90bd0170eb52cf389
          git fetch --no-tags --depth=1 origin ee07f108448c5a1068c0c7b1c0ca6ed7d4cad883
          git fetch --no-tags --depth=1 origin e3cf7c3515602d5fe0dbeeaa91d8a27fc25f5e69
          git fetch --no-tags --depth=1 origin 3527859dfa4d802fda0eaa4a0d96aa05e1471a2d
          git fetch --no-tags --depth=1 origin 91e499b6c0ed0ce0cffdf0c09a35a067a8156c71
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 中文字型（履歷卡與樣張的版面才會跟手機一致）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - name: Node 端守衛（D003：解碼對帳、RLE、壞碼、模擬層純度、零外部素材；D004：切分與量體對拍、注入錯誤）
        run: npm run unit
      - run: npm run build
      - name: 煙霧測試
        run: node tools/smoke.mjs 2>&1 | tee smoke-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: 拍樣張（三畫風×三年份×兩個距離）
        if: always()
        run: node tools/shoot.mjs --out=scratch/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ github.sha }}
          path: |
            smoke-run.txt
            scratch/shots/*.png
            scratch/shots/D048-evidence.json
            scratch/shots/D049-evidence.json
            scratch/shots/D050-evidence.json
            scratch/shots/D051-evidence.json
            scratch/shots/D052-*.json
            scratch/shots/D052-*.code.txt
            scratch/shots/D053-*.json
            scratch/shots/D053-*.code.txt
            scratch/shots/D053-*.html
            scratch/shots/D054-*.json
            scratch/shots/D054-*.code.txt
            scratch/shots/D054-*.html
            scratch/shots/D056-*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  d055:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D055 native food trade capture
        run: node tools/d055-capture.mjs --phase=after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d055-quick-${{ github.sha }}
          path: scratch/d055-after/
          if-no-files-found: error
          retention-days: 14

  d059:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D059 six British village exteriors and native controls
        run: node tools/d059-capture.mjs --phase=after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d059-preview-${{ github.sha }}
          path: scratch/d059-after/
          if-no-files-found: error
          retention-days: 14

  d060:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 360, 412]   # 三種視窗各一個工作，平行拍（桌機 41 張／相；手機 17 張／相）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D060 British industry, same-world before/after photography
        run: node tools/d060-capture.mjs
        env:
          D060_WIDTHS: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d060-preview-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d060/
          if-no-files-found: error
          retention-days: 14

  d061:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D061 landscape, same-world photography at four levels (legacy, 1, 2, 3) over six views
        run: node tools/d061-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d061-preview-${{ github.sha }}
          path: scratch/d061/
          if-no-files-found: error
          retention-days: 14

  d062:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D062 seasons, same-world photography in ten states over six views, and the production clock through the spring-to-summer window
        run: node tools/d062-capture.mjs
      - name: D062 weather, same-world photography in ten states over three views, animation counters, and the production clock (a real rainbow, flash and snowfall from the simulation)
        run: node tools/d062-weather-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d062-preview-${{ github.sha }}
          path: scratch/d062/
          if-no-files-found: error
          retention-days: 14

  d063:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 360, 412]   # 三種視窗各一個工作，平行拍（桌機 36 張／相；手機 15 張／相）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D063 British commerce, same-world before/after photography (seed516 holds all eleven models; ai120 has none and must not change)
        run: node tools/d063-capture.mjs
        env:
          D063_WIDTHS: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d063-preview-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d063/
          if-no-files-found: error
          retention-days: 14

  d064:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 90   # 桌機每相 47 張，其中 22 張是西北向，要等相機轉過去；本機（無其他負載）約 45 分鐘，所以比 d063 的 60 寬
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 360, 412]   # 三種視窗各一個工作，平行拍（桌機每相 47 張、手機每相 24 張）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D064 British merge towers, same-world before/after photography (seed516 holds eight real towers; the fourteen forms in the gallery sample; ai120 has none and must not change)
        run: node tools/d064-capture.mjs
        env:
          D064_WIDTHS: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d064-preview-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d064/
          if-no-files-found: error
          retention-days: 14

  pages:
    needs: [smoke, d055, d059, d060, d061, d062, d063, d064, d068, d069, d070]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  d068:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 360, 412]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D068 real ten-model WebGL pairs and existing-city controls
        run: node tools/d068-capture.mjs
        env:
          D068_WIDTHS: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d068-preview-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d068/
          if-no-files-found: error
          retention-days: 14

  d069:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 360, 412]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D069 real ten-model WebGL pairs and existing-city controls
        run: node tools/d069-capture.mjs
        env:
          D069_WIDTHS: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d069-preview-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d069/
          if-no-files-found: error
          retention-days: 14

  d070:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 360, 412]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D070 real ten-model WebGL pairs and existing-city controls
        run: node tools/d070-capture.mjs
        env:
          D070_WIDTHS: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
