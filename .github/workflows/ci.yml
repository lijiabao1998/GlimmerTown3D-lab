# Isolated read-only QA of immutable D053 product. Never merge or deploy this branch.
name: d054-before
on:
  push:
    branches: ['claude/qa-d054-before']
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chinese font for the unchanged fixed-size original scene
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Capture exact D053 before evidence
        run: node tools/d054-capture.mjs --phase=before --out=scratch/d054-before 2>&1 | tee d054-before-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d054-before-${{ github.sha }}
          path: |
            d054-before-run.txt
            scratch/d054-before
          if-no-files-found: error
          retention-days: 14
