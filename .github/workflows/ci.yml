# QA only. Never merge. No write permissions or Pages/deploy job.
# Parent creates this branch only after authorized exact-candidate main CI/Pages and final image checks succeed.
name: D054 official verification
on:
  push:
    branches: ['claude/d054-live-verification']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d054-official-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/claude/d054-live-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chinese fonts for exact approved PNGs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Offline QA adapter negative checks; no browser launch
        run: node tools/verify-live-d054.mjs --self-test
      - name: Actual official HTML, unchanged D054 native suite and final candidate11 images
        shell: bash
        run: |
          mkdir -p scratch/live-d054
          node tools/verify-live-d054.mjs 2>&1 | tee scratch/live-d054/live-run.txt
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d054-official-verification
          path: |
            scratch/live-d054/*.json
            scratch/live-d054/*.txt
            scratch/shots/D054-*.png
            scratch/shots/D054-*.json
            scratch/shots/D054-*.code.txt
            scratch/shots/D054-*.html
          if-no-files-found: error
          retention-days: 14
