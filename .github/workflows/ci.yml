# QA-only branch. Never merge. No Pages job, environment or deploy permission.
name: D047 official Pages verification
on:
  push:
    branches: ['claude/d047-live-verification']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d047-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/claude/d047-live-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Approved product and original test suites are unchanged
        shell: bash
        run: |
          set -euo pipefail
          approved=3074995be8e71b13af6ea2cec2948264d8eb73d2
          release=64289885a06b0b2991d94cc9f9d59e02d569242d
          test "$(git rev-parse "$approved^{tree}")" = "$(git rev-parse "$release^{tree}")"
          git diff --exit-code "$release" HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)tools/verify-live-d047.mjs'
      - run: npm ci
      - name: Existing Chinese screenshot font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: Approved single-file build SHA256
        shell: bash
        run: echo '7178ca04aed7c9ee07f688586e1f1668daca1877f42e23290516184b336e54f1  dist/index.html' | sha256sum --check
      - name: Actual official Pages art and trusted-touch verification
        shell: bash
        run: node tools/verify-live-d047.mjs 2>&1 | tee live-run.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d047-live-${{ github.sha }}
          path: |
            live-run.txt
            scratch/live-d047/report.json
            scratch/shots/D047-*.png
          if-no-files-found: warn
          retention-days: 14
