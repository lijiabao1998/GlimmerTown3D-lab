# CI-only release bookkeeping and exact-head verification evidence: LOG.md / PR #27.
# 每次推送：型別與完整 Node 守衛獨立跑；單次建置後，完整瀏覽器煙霧與樣張並行。
# smoke 聚合門檻確認每一項成功；瀏覽器與樣張使用同一次建置的逐位元組相同成品。
# main 綠燈之後把 dist/index.html 發到 GitHub Pages：手機直接開網址就能看、能轉。
name: ci

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI-only split: historical Node + D078 frame equal the full Node suite.
  # Browser and screenshots retain their entire commands and acceptance limits.
  # Build once; all consumers verify the same immutable artifact ID and digest.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      digest: ${{ steps.identity.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: CI provenance and fail-closed gate negative controls
        run: node --test .github/scripts/ci-integrity.test.mjs tools/unit-partitions.test.mjs
      - run: npm run build
      - name: Record build source and file hashes
        id: identity
        run: node .github/scripts/ci-integrity.mjs record
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: ci-build-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            ci-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable D066 through D078 source-scope baselines
        run: |
          git fetch --no-tags --depth=1 origin 22da5314145f96aaa83cfb739c382b86e1d5b0f3
          git fetch --no-tags --depth=1 origin 7d4df8a907368a25f1ff92958b8b70ae85b8ad1c
          git fetch --no-tags --depth=1 origin 94024b6e2195f4d545de1f1af770dfbe98c1777a
          git fetch --no-tags --depth=1 origin beca506c224ad72f9a890ed20b5aa1fa7b2616f5
          git fetch --no-tags --depth=1 origin a5674d9bdbfbf439319b50e26c3f864864ab5363
          git fetch --no-tags --depth=1 origin a69397ed0900b1f0a27bdc3be8e1616d2973fc43
          git fetch --no-tags --depth=1 origin f689c35d8d061498779321149ccce4443f0ce6de
          git fetch --no-tags --depth=1 origin 1c40e13a219adb90827acd3b60fb6b7623600b63
          git fetch --no-tags --depth=1 origin bece722ed2480a3728a274c90bd0170eb52cf389
          git fetch --no-tags --depth=1 origin ee07f108448c5a1068c0c7b1c0ca6ed7d4cad883
          git fetch --no-tags --depth=1 origin e3cf7c3515602d5fe0dbeeaa91d8a27fc25f5e69
          git fetch --no-tags --depth=1 origin 3527859dfa4d802fda0eaa4a0d96aa05e1471a2d
          git fetch --no-tags --depth=1 origin 91e499b6c0ed0ce0cffdf0c09a35a067a8156c71
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 中文字型（履歷卡與樣張的版面才會跟手機一致）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - name: Node 端守衛（D003：解碼對帳、RLE、壞碼、模擬層純度、零外部素材；D004：切分與量體對拍、注入錯誤）
        run: npm run unit -- --partition=historical

  node-frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable D066 through D078 source-scope baselines
        run: |
          git fetch --no-tags --depth=1 origin 22da5314145f96aaa83cfb739c382b86e1d5b0f3
          git fetch --no-tags --depth=1 origin 7d4df8a907368a25f1ff92958b8b70ae85b8ad1c
          git fetch --no-tags --depth=1 origin 94024b6e2195f4d545de1f1af770dfbe98c1777a
          git fetch --no-tags --depth=1 origin beca506c224ad72f9a890ed20b5aa1fa7b2616f5
          git fetch --no-tags --depth=1 origin a5674d9bdbfbf439319b50e26c3f864864ab5363
          git fetch --no-tags --depth=1 origin a69397ed0900b1f0a27bdc3be8e1616d2973fc43
          git fetch --no-tags --depth=1 origin f689c35d8d061498779321149ccce4443f0ce6de
          git fetch --no-tags --depth=1 origin 1c40e13a219adb90827acd3b60fb6b7623600b63
          git fetch --no-tags --depth=1 origin bece722ed2480a3728a274c90bd0170eb52cf389
          git fetch --no-tags --depth=1 origin ee07f108448c5a1068c0c7b1c0ca6ed7d4cad883
          git fetch --no-tags --depth=1 origin e3cf7c3515602d5fe0dbeeaa91d8a27fc25f5e69
          git fetch --no-tags --depth=1 origin 3527859dfa4d802fda0eaa4a0d96aa05e1471a2d
          git fetch --no-tags --depth=1 origin 91e499b6c0ed0ce0cffdf0c09a35a067a8156c71
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 中文字型（履歷卡與樣張的版面才會跟手機一致）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Complete D078 frame oracle (all 35 checks, including camera-detail controls)
        run: |
          mkdir -p scratch/d078-node-frame
          set -o pipefail
          node tools/unit-partition.mjs --partition=d078-frame 2>&1 | tee scratch/d078-node-frame/console.log
        shell: bash
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: node-frame-d078-${{ github.sha }}-${{ github.run_attempt }}
          path: scratch/d078-node-frame/
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 中文字型（履歷卡與樣張的版面才會跟手機一致）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
      - name: Verify exact same-run build and source identity
        run: node .github/scripts/ci-integrity.mjs verify
        env:
          CI_BUILD_DIGEST: ${{ needs.build.outputs.digest }}
      - name: 煙霧測試
        run: node tools/smoke.mjs 2>&1 | tee smoke-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: smoke-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            smoke-run.txt
            scratch/shots/*.png
            scratch/shots/D048-evidence.json
            scratch/shots/D049-evidence.json
            scratch/shots/D050-evidence.json
            scratch/shots/D051-evidence.json
            scratch/shots/D052-*.json
            scratch/shots/D052-*.code.txt
            scratch/shots/D053-*.json
            scratch/shots/D053-*.code.txt
            scratch/shots/D053-*.html
            scratch/shots/D054-*.json
            scratch/shots/D054-*.code.txt
            scratch/shots/D054-*.html
            scratch/shots/D056-*.json
          if-no-files-found: warn
          retention-days: 14

  screenshots:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 中文字型（履歷卡與樣張的版面才會跟手機一致）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
      - name: Verify exact same-run build and source identity
        run: node .github/scripts/ci-integrity.mjs verify
        env:
          CI_BUILD_DIGEST: ${{ needs.build.outputs.digest }}
      - name: 拍樣張（三畫風×三年份×兩個距離）
        run: node tools/shoot.mjs --out=scratch/shots
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: smoke-shots-${{ github.sha }}-${{ github.run_attempt }}
          path: scratch/shots/*.png
          if-no-files-found: warn
          retention-days: 14

  # Preserve the original required-check identity. Skips/cancellation are failures,
  # never success. Pages keeps depending on this gate and every existing D job.
  smoke:
    needs: [build, node, node-frame, browser, screenshots]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require every split verification stage and evidence artifact
        run: node .github/scripts/ci-integrity.mjs gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - name: Restore browser evidence (including failed-run diagnostics)
        if: always() && needs.browser.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.browser.outputs.artifact-id }}
          merge-multiple: true
      - name: Restore screenshot evidence after browser evidence (original order)
        if: always() && needs.screenshots.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.screenshots.outputs.artifact-id }}
          path: scratch/shots
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ github.sha }}
          path: |
            smoke-run.txt
            scratch/shots/*.png
            scratch/shots/D048-evidence.json
            scratch/shots/D049-evidence.json
            scratch/shots/D050-evidence.json
            scratch/shots/D051-evidence.json
            scratch/shots/D052-*.json
            scratch/shots/D052-*.code.txt
            scratch/shots/D053-*.json
            scratch/shots/D053-*.code.txt
            scratch/shots/D053-*.html
            scratch/shots/D054-*.json
            scratch/shots/D054-*.code.txt
            scratch/shots/D054-*.html
            scratch/shots/D056-*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
      - name: Verify build again immediately before Pages packaging
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node .github/scripts/ci-integrity.mjs verify
        env:
          CI_BUILD_DIGEST: ${{ needs.build.outputs.digest }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  d055:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D055 native food trade capture
        run: node tools/d055-capture.mjs --phase=after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d055-quick-${{ github.sha }}
          path: scratch/d055-after/
          if-no-files-found: error
          retention-days: 14

  d059:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: D059 six British village exteriors and native controls
        run: node tools/d059-capture.mjs --phase=after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d059-preview-${{ github.sha }}
          path: scratch/d059-after/
          if-no-files-found: error
          retention-days: 14

  d060:
    runs-on: ubuntu-24.04   # D060：釘版。ubuntu-latest 於 2026-10-19 起改指 Ubuntu 26（字型與 Chrome 會變，逐位元組的 PNG golden 會動）
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 360, 412]   # 三種視窗各一個工作，平行拍（桌機 41 張／相；手機 17 張／相）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
