name: D049 original UI baseline (QA only)
on:
  push:
    branches: ['claude/d049-baseline-capture']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck && npm run build
      - run: node tools/capture-d049-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d049-original-baseline
          path: scratch/d049-baseline
          if-no-files-found: error
          retention-days: 14
