# QA-only capture on an unchanged product. Never merge or deploy this branch.
name: D052 baseline capture
on:
  push:
    branches: ['claude/d052-baseline-capture']
permissions:
  contents: read
concurrency:
  group: d052-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Existing Chinese font package for consistent screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Verify baseline HTML and capture six genuine Chrome views
        run: node tools/capture-d052-baseline.mjs 2>&1 | tee d052-baseline-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d052-baseline-${{ github.sha }}
          path: |
            d052-baseline-run.txt
            scratch/d052-baseline/
            tools/d052-scenes.mjs
            tools/d052-capture.mjs
            tools/capture-d052-baseline.mjs
          if-no-files-found: error
          retention-days: 14
