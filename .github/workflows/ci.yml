          cache: npm
      - run: npm ci
      - name: 中文字型（履歷卡與樣張的版面才會跟手機一致）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - name: Node 端守衛（D003：解碼對帳、RLE、壞碼、模擬層純度、零外部素材；D004：切分與量體對拍、注入錯誤）
        run: npm run unit -- --partition=historical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d082-versioned-node-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            scratch/d082-release-mesh-v2/
            scratch/d082-remaining-geometry/*.json
            scratch/d082-remaining-geometry/windows-*.log
            scratch/d082-historical-release-runs/*/report.json
            scratch/d082-historical-release-runs/*/source-inventory.json
            scratch/d082-historical-release-runs/*/*.stdout.log
