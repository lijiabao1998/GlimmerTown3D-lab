# QA-only branch. Never merge. No Pages job, environment, or deploy permission.
name: D048 official Pages verification
on:
  push:
    branches: ['claude/d048-live-verification']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d048-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/claude/d048-live-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Approved product and original test suite are unchanged
        shell: bash
        run: |
          set -euo pipefail
          approved=bfe27e861b34785ba5e9ee011899fb111fbb40ca
          release=3e9dd2adb201a2482156b9b8be9a317f14c577f3
          tree=b42f4ab4d7227a86fa780e6503776e0abe96fd04
          test "$(git rev-parse "$approved^{tree}")" = "$tree"
          test "$(git rev-parse "$release^{tree}")" = "$tree"
          git diff --exit-code "$release" HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)tools/verify-live-d048.mjs'
      - run: npm ci
      - name: Existing Chinese screenshot font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - run: npm run build
      - name: Approved single-file build SHA256
        shell: bash
        run: echo 'cbd5ea3d1235042b9407769fc7bb1d8535a09f9ea43ef5173d15907be9213cec  dist/index.html' | sha256sum --check
      - name: Local source and verifier guard preflight
        run: node tools/verify-live-d048.mjs --preflight
      - name: Actual official Pages trusted-input and save-status verification
        shell: bash
        run: mkdir -p scratch/live-d048; node tools/verify-live-d048.mjs 2>&1 | tee scratch/live-d048/live-run.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d048-live-${{ github.sha }}
          path: |
            scratch/live-d048/live-run.txt
            scratch/live-d048/report.json
            scratch/shots/D048-*.png
            scratch/shots/D048-evidence.json
          if-no-files-found: warn
          retention-days: 14
