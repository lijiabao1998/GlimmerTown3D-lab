# QA-only diagnostic branch; never merge or deploy. Full candidate CI remains required.
name: D052 native press verification
on:
  push:
    branches: ['claude/d052-touch-verification']
permissions:
  contents: read
concurrency:
  group: d052-native-press-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Existing font package
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - name: D052 source and mutation guards only
        run: node tools/unit-d052.mjs 2>&1 | tee d052-native-unit.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - run: npm run build
      - name: D052 real Chrome native interaction suite only
        run: node tools/smoke-d052.mjs 2>&1 | tee d052-native-browser.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d052-native-press-${{ github.sha }}
          path: |
            d052-native-unit.txt
            d052-native-browser.txt
            dist/index.html
            scratch/shots/D052-*
          if-no-files-found: error
          retention-days: 14
