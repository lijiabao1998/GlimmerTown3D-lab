name: d054-recovery-diagnose
on:
  push:
    branches: ['claude/qa-d054-recovery-diagnose']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          ref: 74b884fea79afad8909cea606ff8ad3ebdc7fba7
          path: baseline-source
      - run: npm ci && npm run build
        working-directory: baseline-source
      - name: Original native highway route trace
        run: node tools/d054-recovery-probe.mjs --root=baseline-source/dist --phase=original --expect-hash=0b04a77ac7672de00e01a68cc2fe90c6c7c7faaf77d7eb95abe9fc7a8c5b54cd
      - name: Failed candidate native highway route trace
        run: node tools/d054-recovery-probe.mjs --root=dist --phase=candidate --expect-hash=6d23cd20b1bf205fd94260810edea58a725fe7ec2f8a5ab14510dbca75f99dda
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d054-recovery-diagnose-${{ github.sha }}
          path: scratch/shots/D054-recovery-*
          if-no-files-found: error
          retention-days: 14
