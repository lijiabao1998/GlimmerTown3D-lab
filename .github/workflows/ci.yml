# QA-only branch. Never merge: no product changes, no Pages job, no deploy permissions.
name: D046 official Pages verification
on:
  push:
    branches: ['claude/d046-live-verification']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: git fetch --no-tags --depth=1 origin 01eecbbfb0bff3d40e0f47d49a61f3419c7ca359
      - run: git diff --exit-code 01eecbbfb0bff3d40e0f47d49a61f3419c7ca359 -- src index.html package.json package-lock.json vite.config.ts tsconfig.json
      - run: npm ci
      - name: Existing Chinese screenshot font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: Verify actual Pages bytes and touch-emulated mobile flows
        run: node tools/verify-live-d046.mjs 2>&1 | tee live-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d046-live-${{ github.sha }}
          path: |
            live-run.txt
            scratch/live-d046/*
          if-no-files-found: warn
          retention-days: 14
