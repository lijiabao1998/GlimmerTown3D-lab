name: d084-frontage-candidate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 412, 360]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - run: node --experimental-strip-types proposals/d084/frontage-check.mjs
      - run: node --experimental-strip-types proposals/d084/source-check.mjs
      - run: node --test tools/d084-opt-in.test.mjs tools/d084-source-v2.test.mjs tools/d082-release-source-v2.test.mjs
      - run: npm run typecheck && npm run build
      - name: Download and pin already published main bytes for whole-frame comparison
        run: |
          mkdir -p scratch/d084-baseline
          curl --fail --location --silent --show-error https://lijiabao1998.github.io/GlimmerTown3D-lab/ -o scratch/d084-baseline/index.html
          echo '020540dda8a196eaa75f297b26914a1187d2dd976afdc97a6013fe9d131927b1  scratch/d084-baseline/index.html' | sha256sum --check
      - run: node --experimental-strip-types proposals/d084/browser-check.mjs --width=${{ matrix.width }} --baseline
      - run: node --experimental-strip-types proposals/d084/browser-check.mjs --width=${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d084-frontage-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d084/
          if-no-files-found: error
