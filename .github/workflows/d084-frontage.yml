name: d084-frontage-candidate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 412, 360]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 49808803695280756242174465b35947f59cd106
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - name: Fixed CPU SVG raster diagnostic; WebGL remains original SwiftShader
        run: |
          CHROME_BIN="$(command -v google-chrome)"
          printf '#!/usr/bin/env bash\nexec "%s" --disable-gpu-rasterization "$@"\n' "$CHROME_BIN" > "$RUNNER_TEMP/d085-chrome"
          chmod +x "$RUNNER_TEMP/d085-chrome"
          echo "CHROME_PATH=$RUNNER_TEMP/d085-chrome" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - run: node --experimental-strip-types proposals/d084/frontage-check.mjs
      - run: node --experimental-strip-types proposals/d084/source-check.mjs
      - run: node --test tools/d084-opt-in.test.mjs tools/d084-source-v2.test.mjs tools/d082-release-source-v2.test.mjs
      - run: npm run typecheck && npm run build
      - name: Rebuild immutable e0508af baseline and verify original published bytes
        run: |
          mkdir -p scratch/d084-baseline
          git worktree add --detach scratch/d084-baseline-source e0508afacaf660bc5864d0cc136c22bcedb7f5bb
          (cd scratch/d084-baseline-source && npm ci && npm run build)
          cp scratch/d084-baseline-source/dist/index.html scratch/d084-baseline/index.html
          echo '020540dda8a196eaa75f297b26914a1187d2dd976afdc97a6013fe9d131927b1  scratch/d084-baseline/index.html' | sha256sum --check
      - run: GITHUB_SHA=49808803695280756242174465b35947f59cd106 node --experimental-strip-types proposals/d084/browser-check.mjs --width=${{ matrix.width }} --baseline
      - run: GITHUB_SHA=49808803695280756242174465b35947f59cd106 node --experimental-strip-types proposals/d084/browser-check.mjs --width=${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d084-frontage-${{ matrix.width }}-${{ github.sha }}
          path: scratch/d084/
          if-no-files-found: error
